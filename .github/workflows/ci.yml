name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest（离线，mock LLM）
        run: uv run pytest -q
