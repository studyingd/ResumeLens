[project]
name = "cv"
version = "0.1.0"
description = "ResumeLens — 上传简历，对照岗位 JD 评估优点与待优化点"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# B008：FastAPI 的 Form()/File() 依赖注入必须写在参数默认值，属框架惯例
# B904：HTTPException 转写为响应时链路堆栈无意义，不强制 from
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["B008", "B904"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
